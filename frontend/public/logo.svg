<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#e11d48" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="shieldFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.05" />
    </linearGradient>

    <linearGradient id="networkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="256" height="256" rx="48" fill="#090d16" />
  
  <!-- Outer Glow Halo -->
  <path d="M 128 32 L 204 68 C 204 148 168 200 128 224 C 88 200 52 148 52 68 Z"
        fill="none" stroke="#f43f5e" stroke-width="8" opacity="0.25" filter="url(#softGlow)" />

  <!-- Shield Base Background -->
  <path d="M 128 36 L 200 70 C 200 144 166 194 128 216 C 90 194 56 144 56 70 Z"
        fill="url(#shieldFill)" stroke="url(#shieldGrad)" stroke-width="4.5" stroke-linejoin="round" />

  <!-- Inner Shield Accent Line -->
  <path d="M 128 50 L 186 78 C 186 136 158 178 128 198 C 98 178 70 136 70 78 Z"
        fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.2" />

  <!-- Network Edges (Sybil Graph Connections) -->
  <g stroke="url(#networkGrad)" stroke-width="2.5" stroke-linecap="round" opacity="0.85">
    <line x1="88" y1="96" x2="128" y2="128" />
    <line x1="168" y1="96" x2="128" y2="128" />
    <line x1="88" y1="96" x2="108" y2="164" />
    <line x1="168" y1="96" x2="148" y2="164" />
    <line x1="108" y1="164" x2="128" y2="128" />
    <line x1="148" y1="164" x2="128" y2="128" />
    <line x1="108" y1="164" x2="148" y2="164" />
    <line x1="128" y1="80" x2="88" y2="96" />
    <line x1="128" y1="80" x2="168" y2="96" />
    <line x1="128" y1="80" x2="128" y2="128" />
  </g>

  <!-- Central Nexus Core Ring (Sentinel Node) -->
  <circle cx="128" cy="128" r="22" fill="#0f172a" stroke="url(#shieldGrad)" stroke-width="4" filter="url(#glow)" />
  <circle cx="128" cy="128" r="10" fill="#f43f5e" />
  <circle cx="128" cy="128" r="4" fill="#ffffff" />

  <!-- Surrounding Graph Entity Nodes -->
  <!-- Top Node -->
  <circle cx="128" cy="80" r="7" fill="#8b5cf6" stroke="#ffffff" stroke-width="2" />
  <!-- Left Node -->
  <circle cx="88" cy="96" r="7" fill="#f43f5e" stroke="#ffffff" stroke-width="2" />
  <!-- Right Node -->
  <circle cx="168" cy="96" r="7" fill="#8b5cf6" stroke="#ffffff" stroke-width="2" />
  <!-- Bottom-Left Node -->
  <circle cx="108" cy="164" r="7" fill="#f43f5e" stroke="#ffffff" stroke-width="2" />
  <!-- Bottom-Right Node -->
  <circle cx="148" cy="164" r="7" fill="#8b5cf6" stroke="#ffffff" stroke-width="2" />
</svg>
